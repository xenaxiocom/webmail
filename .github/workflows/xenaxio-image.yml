name: xenaxio web image

# The xenaxio web client as a container (Dockerfile.lite with the xenaxio
# build settings), published for the platform deploy:
#   ghcr.io/xenaxiocom/webmail:<commit sha>  and  :main
# The platform repository (es-ua/xenaxio) pulls it in its deploy workflow.
# The package is public, like this repository (AGPL-3.0).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xenaxio-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/webmail

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.lite
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.title=Xenaxio web client
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            LITE_LOCALES=en,de
            LITE_APP_NAME=Xenaxio
            GIT_COMMIT=${{ github.sha }}
          # No build cache: any job on main can write the Actions cache, and a
          # published image must not ship what one left (scripts/check-action-pins.mjs).

      - name: Summary
        env:
          SHA: ${{ github.sha }}
        run: echo "Published \`${IMAGE}:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
